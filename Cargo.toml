[package]
name = "scrying-bull"
version = "0.2.0"
edition = "2021"
description = "Run hundreds of very different trading strategies side by side: backtest, paper trade, publish."
license = "MIT"

[[bin]]
name = "scry"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json", "gzip"] }

[profile.release]
lto = "thin"
codegen-units = 4
