# Every US market day after the close: fetch prices, advance the paper ledger,
# rebuild the site and publish it to GitHub Pages.
#
# The ledger lives on its own `ledger` branch so the main branch stays clean and
# the paper-trading history is an auditable, append-only git log.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# Optional broker mirroring (see README "Trading with real money"):
#   secrets   ALPACA_KEY_ID, ALPACA_SECRET_KEY
#   variables LIVE_EXECUTE=true      -> send orders (otherwise dry run in the log)
#             LIVE_REAL_MONEY=true   -> required when scry.toml has live.mode = "live"

name: Daily

on:
  schedule:
    - cron: "17 22 * * 1-5" # 22:17 UTC, after the US close (and after DST shifts)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out ledger branch
        run: |
          if git ls-remote --exit-code --heads origin ledger >/dev/null; then
            git fetch --depth=1 origin ledger
            git worktree add ledger origin/ledger
          else
            git worktree add --detach ledger
            (cd ledger && git checkout --orphan ledger-new && git rm -rfq .)
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Fetch, backtest, paper trade, build site
        run: ./target/release/scry daily --ledger ledger/ledger.json --out site

      - name: Mirror strategies to broker
        if: ${{ env.ALPACA_KEY_ID != '' }}
        continue-on-error: true # never block the paper ledger or the site
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          args="--ledger ledger/ledger.json --state ledger/live_state.json"
          [ "${{ vars.LIVE_EXECUTE }}" = "true" ] && args="$args --execute"
          [ "${{ vars.LIVE_REAL_MONEY }}" = "true" ] && args="$args --real-money"
          ./target/release/scry live $args

      - name: Commit ledger
        working-directory: ledger
        run: |
          git config user.name "scrying-bull-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json $(ls live_state.json live_log.jsonl 2>/dev/null)
          if git diff --cached --quiet; then
            echo "ledger unchanged"
          else
            git commit -qm "paper: $(date -u +%F)"
            git push origin HEAD:refs/heads/ledger
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
